<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Matematika Seru</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Comic Sans MS','Segoe UI',sans-serif; }
  html, body { height:100%; overflow:hidden; }
  body {
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg,#667eea,#764ba2); padding:10px;
  }
  .page { display:none; background:#fff; border-radius:25px; padding:20px 25px;
    width:100%; max-width:1000px; max-height:96vh; text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.3); overflow:auto; }
  .page.active { display:block; animation:pop .4s ease; }
  @keyframes pop { from{transform:scale(.85);opacity:0} to{transform:scale(1);opacity:1} }

  h1 { font-size:48px; color:#764ba2; margin-bottom:10px; }
  h2 { font-size:36px; color:#764ba2; margin-bottom:15px; }
  p.sub { font-size:24px; color:#555; margin-bottom:25px; }

  .btn {
    font-size:30px; padding:18px 55px; border:none; border-radius:50px; cursor:pointer;
    background:linear-gradient(135deg,#ff9a44,#fc6076); color:#fff;
    box-shadow:0 8px 0 rgba(0,0,0,.2); transition:.15s; font-weight:bold;
  }
  .btn:hover { transform:translateY(-4px); }
  .btn:active { transform:translateY(2px); box-shadow:0 3px 0 rgba(0,0,0,.2); }

  .levels { display:flex; flex-wrap:wrap; gap:20px; justify-content:center; }
  .level-btn {
    font-size:24px; width:120px; height:120px; border-radius:50%; border:6px solid #fff;
    cursor:pointer; color:#fff; font-weight:bold; box-shadow:0 6px 0 rgba(0,0,0,.25); transition:.15s;
  }
  .level-btn:hover { transform:scale(1.12); }
  .lv1{background:#4caf50}.lv2{background:#2196f3}.lv3{background:#ff9800}
  .lv4{background:#e91e63}.lv5{background:#9c27b0}

  /* ====== LAYOUT HALAMAN SOAL ====== */
  .game-area { display:flex; gap:20px; margin-bottom:15px; text-align:left; }
  .col-soal  { flex:1.5; }
  .col-jawab { flex:1; }

  .col-title { font-size:22px; font-weight:bold; color:#764ba2; text-align:center; margin-bottom:10px; }

  /* soal: 2 kolom x 5 baris */
  .questions {
    display:grid; grid-template-columns:1fr 1fr; gap:12px;
  }

  /* nomor urut di LUAR kotak soal (lingkaran) */
  .qitem {
    display:flex; align-items:center; gap:8px;
    min-width:0;   /* penting: izinkan isi menyusut, tidak meluber */
  }
  .qnum {
    flex-shrink:0;
    width:42px; height:42px; border-radius:50%;
    background:linear-gradient(135deg,#42a5f5,#1e88e5);
    color:#fff; font-size:20px; font-weight:bold;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 3px 0 rgba(0,0,0,.2);
  }
  .qitem:nth-child(even) .qnum { background:linear-gradient(135deg,#66bb6a,#43a047); }

  .qbox {
    flex:1;
    min-width:0;   /* penting agar kotak tidak meluber keluar grid */
    font-size:clamp(18px,2.8vh,28px); font-weight:bold; background:#e8eaf6; color:#333;
    padding:6px 10px; border-radius:12px; border:3px dashed #764ba2;
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    white-space:nowrap;      /* soal tetap 1 baris, tidak patah */
  }
  .qbox > span { overflow:hidden; text-overflow:ellipsis; }

  .drop-zone {
    flex-shrink:0;
    min-width:64px; max-width:80px; height:50px; border-radius:10px; background:#fff;
    border:3px dashed #aaa; display:flex; align-items:center; justify-content:center;
    font-weight:bold; color:#764ba2; transition:.15s; cursor:pointer;
    padding:0 6px;
  }

  .drop-zone.hover { background:#fff3c4; border-color:#ff9800; transform:scale(1.1); }
  .drop-zone.filled { background:#42a5f5; border-color:#1e88e5; color:#fff; }
  .qbox.correct .drop-zone { background:#c8f7c5; border-color:#4caf50; color:#2e7d32; }
  .qbox.wrong   .drop-zone { background:#ffcdd2; border-color:#e53935; color:#c62828; }

  .answers { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; align-content:flex-start; }
  .answer {
    font-size:clamp(22px,3.5vh,32px); font-weight:bold; padding:12px 20px; border-radius:12px;
    background:linear-gradient(135deg,#42a5f5,#1e88e5); color:#fff; cursor:pointer;
    box-shadow:0 5px 0 rgba(0,0,0,.2); user-select:none; touch-action:none;
    transition:.15s;
  }
  .answer:hover { transform:scale(1.08); }
  .answer.selected { background:linear-gradient(135deg,#ffca28,#ff9800); transform:scale(1.12);
    box-shadow:0 0 0 4px #ffd54f, 0 5px 0 rgba(0,0,0,.2); }
  .answer.dragging { opacity:.35; }
  .answer.used { visibility:hidden; }

  /* salinan jawaban saat drag */
  .ghost {
    position:fixed; z-index:999; pointer-events:none; opacity:.9;
    font-size:clamp(22px,3.5vh,32px); font-weight:bold; padding:12px 20px; border-radius:12px;
    background:linear-gradient(135deg,#ffca28,#ff9800); color:#fff;
    box-shadow:0 10px 25px rgba(0,0,0,.4); transform:translate(-50%,-50%);
  }

  .info-bar { display:flex; justify-content:space-between; font-size:26px;
    font-weight:bold; color:#764ba2; margin-bottom:12px; }
  #btnCek { background:linear-gradient(135deg,#66bb6a,#43a047); padding:14px 50px; font-size:28px; }

  .score-text { font-size:65px; font-weight:bold; color:#764ba2; margin:10px 0; }
  .stars { font-size:45px; margin-bottom:18px; }
  .btn-row { display:flex; gap:15px; justify-content:center; flex-wrap:wrap; }

  @media (max-width:700px){
    html,body{overflow:auto}
    .game-area{flex-direction:column}
    .questions{grid-template-columns:1fr}
    .qnum{ width:34px; height:34px; font-size:16px; }
    .drop-zone{ height:44px; min-width:56px; }
  }
</style>
</head>
<body>

<!-- HALAMAN 1: AWAL -->
<div class="page active" id="page1">
  <h1>🎮 Game Matematika</h1>
  <p class="sub">Penjumlahan Seru untuk Anak SD! ✏️</p>
  <div style="font-size:90px; margin-bottom:15px;">🔢➕😊</div>
  <button class="btn" onclick="goTo(2)">▶ MULAI</button>
</div>

<!-- HALAMAN 2: PILIH LEVEL -->
<div class="page" id="page2">
  <h2>Pilih Level</h2>
  <p class="sub">Maksimal hasil penjumlahan:</p>
  <div class="levels">
    <button class="level-btn lv1" onclick="pilihLevel(1)">Level 1<br>≤ 10</button>
    <button class="level-btn lv2" onclick="pilihLevel(2)">Level 2<br>≤ 20</button>
    <button class="level-btn lv3" onclick="pilihLevel(3)">Level 3<br>≤ 30</button>
    <button class="level-btn lv4" onclick="pilihLevel(4)">Level 4<br>≤ 40</button>
    <button class="level-btn lv5" onclick="pilihLevel(5)">Level 5<br>≤ 50</button>
  </div>
</div>

<!-- HALAMAN 3: SOAL (2 KOLOM SOAL KIRI, JAWABAN KANAN) -->
<div class="page" id="page3">
  <div class="info-bar">
    <span id="lblLevel">Level 1</span>
    <span id="lblSkor">Skor: 0</span>
  </div>

  <!-- skor hasil (muncul setelah koreksi) — DI ATAS -->
  <div id="areaSkor" style="display:none; margin:5px 0 10px;">
    <div class="score-text" style="font-size:44px; margin:0;" id="skorInline">Skor: 0</div>
    <div class="stars" style="font-size:32px; margin:5px 0;" id="bintangInline"></div>
  </div>

  <div class="game-area">
    <div class="col-soal">
      <div class="col-title">📝 Soal &nbsp;<small style="font-size:15px;color:#888">(klik / tarik jawaban ke kotak)</small></div>
      <div class="questions" id="soalContainer"></div>
    </div>
    <div class="col-jawab">
      <div class="col-title">🧩 Jawaban<br><small style="font-size:15px;color:#888">(klik jawaban, lalu klik kotak)</small></div>
      <div class="answers" id="jawabContainer"></div>
    </div>
  </div>

  <button class="btn" id="btnCek" onclick="cekJawaban()">✅ Periksa Jawaban</button>

  <!-- tombol (muncul setelah koreksi) — DI BAWAH -->
  <div id="areaTombol" style="display:none; margin-top:15px;">
    <div class="btn-row">
      <button class="btn" style="background:linear-gradient(135deg,#42a5f5,#1e88e5)" onclick="ulangLevel()">🔁 Main Lagi</button>
      <button class="btn" style="background:linear-gradient(135deg,#ab47bc,#8e24aa)" onclick="goTo(2)">📚 Ganti Level</button>
    </div>
  </div>
</div>

<script>
/* ============ EFEK SUARA ============ */
var audioCtx = null;
function getCtx(){
  if(!audioCtx){ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
  if(audioCtx.state === 'suspended'){ audioCtx.resume(); }
  return audioCtx;
}
function nada(freq, dur, tipe, vol, delay){
  dur = dur || 0.15; tipe = tipe || 'sine'; vol = vol || 0.3; delay = delay || 0;
  try{
    var c = getCtx();
    var o = c.createOscillator();
    var g = c.createGain();
    o.type = tipe;
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol, c.currentTime + delay);
    g.gain.exponentialRampToValueAtTime(0.01, c.currentTime + delay + dur);
    o.connect(g);
    g.connect(c.destination);
    o.start(c.currentTime + delay);
    o.stop(c.currentTime + delay + dur);
  }catch(e){}
}
function suaraKlik(){ nada(600, 0.1, 'triangle', 0.3); }
function suaraLevel(){ nada(523,0.15,'square',0.2,0); nada(659,0.15,'square',0.2,0.1); nada(784,0.2,'square',0.2,0.2); }
function suaraAmbil(){ nada(900, 0.08, 'sine', 0.25); }
function suaraLetak(){ nada(400, 0.1, 'sine', 0.3); }
function suaraKembali(){ nada(300, 0.1, 'sine', 0.25); }
function suaraBenar(){ nada(523,0.12,'sine',0.3,0); nada(659,0.12,'sine',0.3,0.1); nada(784,0.12,'sine',0.3,0.2); nada(1047,0.25,'sine',0.3,0.3); }
function suaraSalah(){ nada(220,0.25,'sawtooth',0.2,0); nada(160,0.35,'sawtooth',0.2,0.15); }

/* ============ LOGIKA GAME ============ */
var level = 1;
var soalList = [];
var jawabanTerpilih = null;   // untuk mode klik

function goTo(n){
  suaraKlik();
  batalkanPilihan();
  var pages = document.querySelectorAll('.page');
  for(var i=0; i<pages.length; i++){ pages[i].classList.remove('active'); }
  document.getElementById('page' + n).classList.add('active');
}

function pilihLevel(n){
  level = n;
  suaraLevel();
  document.getElementById('lblLevel').textContent = 'Level ' + n + ' (maks ' + (n*10) + ')';
  buatSoal();
  goTo(3);
}

function buatSoal(){
  document.querySelectorAll('.qbox').forEach(function(q){ q.classList.remove('correct','wrong'); });
  document.querySelectorAll('.drop-zone').forEach(function(z){ z.classList.remove('filled'); });

  var maks = level * 10;
  soalList = [];
  var dipakai = {};
  while(soalList.length < 10){
    var a = Math.floor(Math.random() * maks) + 1;
    var b = Math.floor(Math.random() * (maks - a)) + 1;
    var kunci = a + '+' + b;
    if(!dipakai[kunci]){
      dipakai[kunci] = true;
      soalList.push({ a: a, b: b, jawab: a + b });
    }
  }

  var jawaban = [];
  for(var i=0; i<soalList.length; i++){ jawaban.push(soalList[i].jawab); }

  // tambah 2 jawaban pengecoh (salah, tapi tidak terlalu jauh dari jawaban asli)
  while(jawaban.length < 12){
    var acak = soalList[Math.floor(Math.random() * soalList.length)];
    var offset = (Math.random() < 0.5) ? -1 : 1;
    var r = acak.jawab + offset;
    if(r >= 2 && jawaban.indexOf(r) === -1){ jawaban.push(r); }
  }
  jawaban.sort(function(){ return Math.random() - 0.5; });

  // Render soal: lingkaran nomor di LUAR kotak, grid 2 kolom x 5 baris
  var sc = document.getElementById('soalContainer');
  sc.innerHTML = '';
  for(var i=0; i<soalList.length; i++){
    var item = document.createElement('div');
    item.className = 'qitem';

    var num = document.createElement('div');
    num.className = 'qnum';
    num.textContent = (i + 1);

    var d = document.createElement('div');
    d.className = 'qbox';
    d.innerHTML = '<span>' + soalList[i].a + ' + ' + soalList[i].b + ' =</span>' +
                  '<div class="drop-zone" data-index="' + i + '">?</div>';

    item.appendChild(num);
    item.appendChild(d);
    sc.appendChild(item);
  }

  // Render jawaban di kolom kanan
  var jc = document.getElementById('jawabContainer');
  jc.innerHTML = '';
  for(var i=0; i<jawaban.length; i++){
    var a = document.createElement('div');
    a.className = 'answer';
    a.textContent = jawaban[i];
    jc.appendChild(a);
  }

  document.getElementById('lblSkor').textContent = 'Skor: 0';
}

/* ============ MODE KLIK: klik jawaban -> klik kotak ============ */
function batalkanPilihan(){
  jawabanTerpilih = null;
  var all = document.querySelectorAll('.answer');
  for(var i=0; i<all.length; i++){ all[i].classList.remove('selected'); }
}

function pilihJawabanKlik(ev){
  var el = ev.target.closest ? ev.target.closest('.answer') : null;
  if(!el || el.classList.contains('used')){ return; }
  ev.preventDefault();
  ev.stopPropagation();

  if(jawabanTerpilih === el){
    batalkanPilihan();
    suaraKembali();
    return;
  }
  batalkanPilihan();
  jawabanTerpilih = el;
  el.classList.add('selected');
  suaraAmbil();
}

function klikDropZone(ev){
  var z = ev.target.closest ? ev.target.closest('.drop-zone') : null;
  if(!z){ return; }
  ev.preventDefault();
  ev.stopPropagation();

  if(jawabanTerpilih){
    letusKotak(z, jawabanTerpilih);
    return;
  }

  if(z.dataset.jawab){
    kembalikanDari(z);
    suaraKembali();
  }
}

function letusKotak(z, answerEl){
  if(z.dataset.jawab){
    var lama = z.dataset.jawab;
    var all = document.querySelectorAll('.answer');
    for(var j=0; j<all.length; j++){
      if(all[j].textContent === lama && all[j] !== answerEl){ all[j].classList.remove('used'); }
    }
  }
  z.textContent = answerEl.textContent;
  z.dataset.jawab = answerEl.textContent;
  z.classList.add('filled');          // kotak jadi BIRU
  answerEl.classList.add('used');
  batalkanPilihan();
  suaraLetak();
}

function kembalikanDari(z){
  var lama = z.dataset.jawab;
  if(!lama){ return; }
  var all = document.querySelectorAll('.answer');
  for(var j=0; j<all.length; j++){
    if(all[j].textContent === lama){ all[j].classList.remove('used'); break; }
  }
  z.textContent = '?';
  z.classList.remove('filled');       // biru hilang, kembali putih
  delete z.dataset.jawab;
}

/* ============ MODE DRAG & DROP ============ */
var dragEl = null;
var ghost = null;

function posisi(ev){
  if(ev.touches && ev.touches.length > 0){ return ev.touches[0]; }
  return ev;
}

function mulaiDrag(ev){
  var target = ev.target.closest ? ev.target.closest('.answer') : null;
  if(!target || target.classList.contains('used')){ return; }
  dragEl = target;
  dragEl.classList.add('dragging');

  ghost = document.createElement('div');
  ghost.className = 'ghost';
  ghost.textContent = dragEl.textContent;
  ghost.style.display = 'none';
  document.body.appendChild(ghost);
}

function gerakDrag(ev){
  if(!dragEl || !ghost){ return; }
  ev.preventDefault();
  var p = posisi(ev);
  ghost.style.display = 'block';
  ghost.style.left = p.clientX + 'px';
  ghost.style.top = p.clientY + 'px';

  var zones = document.querySelectorAll('.drop-zone');
  for(var i=0; i<zones.length; i++){
    var r = zones[i].getBoundingClientRect();
    var diDalam = p.clientX >= r.left && p.clientX <= r.right &&
                  p.clientY >= r.top && p.clientY <= r.bottom;
    zones[i].classList.toggle('hover', diDalam);
  }
}

function akhirDrag(ev){
  if(!dragEl){ return; }
  var p = (ev.type === 'touchend' && ev.changedTouches && ev.changedTouches.length > 0)
          ? ev.changedTouches[0] : posisi(ev);
  var zones = document.querySelectorAll('.drop-zone');
  var diletakkan = false;
  var pernahGerak = ghost && ghost.style.display === 'block';

  if(pernahGerak && p){
    for(var i=0; i<zones.length; i++){
      var z = zones[i];
      z.classList.remove('hover');
      var r = z.getBoundingClientRect();
      if(p.clientX >= r.left && p.clientX <= r.right && p.clientY >= r.top && p.clientY <= r.bottom){
        letusKotak(z, dragEl);
        diletakkan = true;
        break;
      }
    }
  }

  if(ghost){ ghost.remove(); ghost = null; }
  if(dragEl){ dragEl.classList.remove('dragging'); dragEl = null; }
}

document.addEventListener('mousedown', mulaiDrag);
document.addEventListener('mousemove', gerakDrag);
document.addEventListener('mouseup', akhirDrag);
document.addEventListener('touchstart', mulaiDrag, {passive:true});
document.addEventListener('touchmove', gerakDrag, {passive:false});
document.addEventListener('touchend', akhirDrag);

/* klik (mouse & tap) untuk mode klik-jawaban */
document.addEventListener('click', function(ev){
  if(ev.target.closest && ev.target.closest('.answer')){ pilihJawabanKlik(ev); }
  else if(ev.target.closest && ev.target.closest('.drop-zone')){ klikDropZone(ev); }
});

/* ============ CEK JAWABAN ============ */
function cekJawaban(){
  var terisi = 0;
  var zones = document.querySelectorAll('.drop-zone');
  for(var i=0; i<zones.length; i++){
    var isi = parseInt(zones[i].textContent);
    if(!isNaN(isi)){ terisi++; }
  }

  // Jika belum semua diisi: HANYA pop-up, TANPA koreksi warna
  if(terisi < 10){
    suaraSalah();
    alert('Isi dulu semua kotak ya! Sudah terisi ' + terisi + ' dari 10');
    return;
  }

  // Semua sudah diisi -> koreksi
  var benar = 0;
  for(var i=0; i<soalList.length; i++){
    var z = document.querySelector('.drop-zone[data-index="' + i + '"]');
    var qbox = z.closest('.qbox');
    var isi = parseInt(z.textContent);
    if(isi === soalList[i].jawab){
      qbox.classList.add('correct'); qbox.classList.remove('wrong');
      benar++;
    } else {
      qbox.classList.add('wrong'); qbox.classList.remove('correct');
    }
  }

  if(benar > 5){ suaraBenar(); } else { suaraSalah(); }
  document.getElementById('lblSkor').textContent = 'Skor: ' + benar;

  // tampilkan skor di ATAS
  document.getElementById('areaSkor').style.display = 'block';
  document.getElementById('skorInline').textContent = 'Skor: ' + benar + '/10';
  var bintang = Math.max(1, Math.round(benar / 2));
  var s = '';
  for(var i=0; i<bintang; i++){ s += '⭐'; }
  document.getElementById('bintangInline').textContent = s;

  // tampilkan tombol di BAWAH
  document.getElementById('areaTombol').style.display = 'block';

  // sembunyikan tombol periksa agar tidak diklik 2x
  // document.getElementById('btnCek').style.display = 'none';

  document.getElementById('lblLevel').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function ulangLevel(){
  suaraLevel();
  document.getElementById('areaSkor').style.display = 'none';
  document.getElementById('areaTombol').style.display = 'none';
  document.getElementById('btnCek').style.display = 'inline-block';
  buatSoal();
}
</script>
</body>
</html>
